<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>photographs on 35mm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
   <!-- PHOTOGRAPHY -->
  <section id="photography" class="section photography">
    <div class="section-inner">
      <div class="section-label">Photography</div>
      <h2 class="section-title">Albums</h2>
      <div class="albums-row">
 
        <!-- Album 1: Portraits -->
        <div class="album-stack" data-title="Portraits">
          <!-- Replace .album-card divs with: <div class="album-card"><img src="images/photography/portraits/1.jpg" alt=""></div> -->
          <div class="album-card"><img src="260429000035740003.jpg" alt="Description"/><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <span class="album-stack-spacer"></span>
          <p class="album-label">Portraits<span class="album-count">5 photos</span></p>
        </div>
 
        <!-- Album 2: Landscapes -->
        <div class="album-stack" data-title="Landscapes">
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <span class="album-stack-spacer"></span>
          <p class="album-label">Landscapes<span class="album-count">4 photos</span></p>
        </div>
 
        <!-- Album 3: Street -->
        <div class="album-stack" data-title="Street">
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <span class="album-stack-spacer"></span>
          <p class="album-label">Street<span class="album-count">3 photos</span></p>
        </div>
 
        <!-- Album 4: Still Life -->
        <div class="album-stack" data-title="Still Life">
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <div class="album-card"><div class="album-ph"></div></div>
          <span class="album-stack-spacer"></span>
          <p class="album-label">Still Life<span class="album-count">4 photos</span></p>
        </div>

  <script src="main.js"></script>
  <script src="albums.js"></script>
        </body>
